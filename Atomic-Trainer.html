rom":"F55555 - GoroArmeT (lichess.org/no9xJxut)","n":19,"lvl":2},{"fen":"rn1qk2r/pp1b1Bp1/2pP4/5p2/1b2p3/2P1P3/PP3PPP/RN1QK2R b KQkq - 2 11","sol":"e8f8","type":"defense","side":"b","from":"FeodorPt - F55555 (lichess.org/Ty7M7Wfg)","n":20,"lvl":2},{"fen":"8/p4kp1/1pp1Q3/8/3p4/1P6/PB3P2/R5K1 b - - 8 26","sol":"f7f8","type":"defense","side":"b","from":"F55555 - FeodorPt (lichess.org/zDhYICGo)","n":21,"lvl":2},{"fen":"2k5/ppp1rQp1/8/3p4/5p2/2P3P1/PP6/RNBK3R w - - 2 19","sol":"h1h8","type":"mate2","side":"w","from":"F55555 - FeodorPt (lichess.org/atFkLN7M)","n":22,"lvl":3},{"fen":"r3k3/pp2q3/n1p5/1B1ppp2/5P1P/2NPP3/P1PB4/2KR4 b q - 0 20","sol":"e7a3","type":"mate2","side":"b","from":"FeodorPt - F55555 (lichess.org/6y27ch5W)","n":23,"lvl":3},{"fen":"rnb1k2r/pp4pp/1q3n2/3p2B1/8/7N/PPP2PPP/R2K3R b kq - 1 11","sol":"b6d4","type":"mate2","side":"b","from":"FeodorPt - F55555 (lichess.org/3ZClO79t)","n":24,"lvl":3},{"fen":"r3k3/p1p3pP/bpn5/3p4/1b6/2P1P1PB/PP3pK1/RNB4R b q - 1 17","sol":"f2f1q","type":"mate2","side":"b","from":"F55555 - FeodorPt (lichess.org/qyNQfLtj)","n":25,"lvl":3},{"fen":"r3R3/pp4k1/3p2q1/4p3/4P3/1P3PP1/P1P5/1K1Rb3 w - - 7 24","sol":"e8g8","type":"mate2","side":"w","from":"maxwellssilvrhaMMer - k1ll-shot (lichess.org/Cc82zXjx)","n":26,"lvl":3}],"lessons":[{"id":"boom-basic","fen":"k7/8/8/8/4p3/3P4/8/K7 w - - 0 1","moves":["d3e4"],"title":"Взятие = взрыв","text":"Пешка d3 берёт пешку e4. Обе фигуры исчезают — и бьющая, и битая!"},{"id":"boom-radius","fen":"6k1/8/8/5n2/4p3/3Q4/8/K7 w - - 0 1","moves":["d3e4"],"title":"Радиус взрыва","text":"Ферля забирает пешку e4 — и взрыв уничтожает коня f5 рядом! Взрыв бьёт все небитые фигуры в 8 соседних клетках (кроме пешек)."},{"id":"own-king","fen":"k7/7K/7p/8/8/8/8/7R w - - 0 1","moves":[],"title":"Своего короля взрывать нельзя","text":"Ладья h1 хочет взять пешку h6 — но взрыв уничтожит короля h7! Такой ход ЗАПРЕЩЁН, ладье надо уходить (например, a1)."},{"id":"kings-adjacent","fen":"8/8/8/3kK3/8/8/8/8 w - - 0 1","moves":[],"title":"Короли могут стоять рядом!","text":"В атомных шахматах короли НЕ атакуют друг друга и могут стоять рядом. Мат ставится только настоящими фигурами или взрывом."},{"id":"real-mate","fen":"rnb1k2r/pp3Npp/2p1p3/1B1p1p1Q/1b1PnP2/2P1P1Pq/PP5P/RNB1K2R b KQkq - 2 10","moves":["h3f1"],"title":"Мат из реальной партии F55555","text":"Позиция из вашей партии (чёрные). Ферль h4 идёт на f1 — мат! В обычных шахматах король просто взял бы ферзя, но в атоме взрыв уничтожил бы собственную охрану — это классический «тихий мат»."}],"topOpen":[["g1f3 e7e5",7],["b1c3 e7e5",6],["e2e3 e7e6",5],["g1h3 e7e5",3],["g1f3 f7f6",3],["e2e3 g8f6",1]],"course":[{"part_ru":"Часть первая. Элементы","part_en":"Part one. The elements","chapters":[{"id":"boom-basic","fen":"k7/8/8/8/4p3/3P4/8/K7 w - - 0 1","moves":["d3e4"],"title_ru":"Взрыв — душа атомных шахмат","title_en":"The explosion — the soul of atomic chess","text_ru":"Вся партия держится на одном механизме. Правило: при взятии исчезают бьющая фигура, битая фигура и все фигуры вокруг точки взрыва. Не пешки — они бронированы. Здесь пешка d3×e4: обе пешки исчезают.","text_en":"The whole game rests on one mechanism. Rule: on a capture, the capturing piece, the captured piece and every piece around the blast vanish. Not pawns — they are armored. Here d3×e4: both pawns vanish.","num":1},{"id":"boom-radius","fen":"6k1/8/8/5n2/4p3/3Q4/8/K7 w - - 0 1","moves":["d3e4"],"title_ru":"Радиус взрыва","title_en":"The blast radius","text_ru":"Взрыв бьёт на восемь клеток вокруг точки взятия. Ферзь d3×e4 уничтожает коня f5 — и погибает сама. Железное правило атома: перед каждым взятием считайте фигуры в радиусе.","text_en":"The blast hits the eight squares around the capture. Queen d3×e4 destroys the knight f5 — and dies itself. The iron rule of atomic: before every capture, count the pieces in the radius.","num":2},{"id":"pawn-armor","fen":"6k1/8/8/3p1p2/4p3/3Q4/8/K7 w - - 0 1","moves":["d3e4"],"title_ru":"Пешки — бронированная техника","title_en":"Pawns — the armored force","text_ru":"Пешки — единственные солдаты, которых взрыв не берёт. Чёрные пешки d5 и f5 стоят вплотную к полю взрыва e4 — и невредимы. Погибает только ферзь. Пешечная цепь — это крепость.","text_en":"Pawns are the only soldiers the blast cannot touch. The black pawns d5 and f5 stand right next to the blast square e4 — unharmed. Only the queen dies. A pawn chain is a fortress.","num":3},{"id":"own-king","fen":"k7/7K/7p/8/8/8/8/7R w - - 0 1","moves":[],"title_ru":"Запрещённый подвиг","title_en":"The forbidden exploit","text_ru":"Ладья h1 бьёт пешку h6, но взрыв накрывает своего короля h7 — ход запрещён. Атом прощает всё, кроме самоубийства короля.","text_en":"The rook h1 captures the pawn h6, but the blast covers your own king h7 — the move is forbidden. Atomic forgives everything except the king's suicide.","num":4},{"id":"kings-adjacent","fen":"8/8/8/3kK3/8/8/8/8 w - - 0 1","moves":[],"title_ru":"Короли — соседи","title_en":"Kings — the neighbors","text_ru":"Короли могут стоять вплотную: в атоме они не атакуют друг друга. Больше того — пока короли рядом, шахов нет вовсе. Чужой король — лучший щит.","text_en":"Kings may stand side by side: in atomic they do not attack each other. Moreover — while the kings are adjacent, there are no checks at all. The enemy king is the best shield.","num":5}]},{"part_ru":"Часть вторая. Тактика","part_en":"Part two. Tactics","chapters":[{"id":"boom-win","fen":null,"moves":[],"title_ru":"Победа №1 — взрыв короля","title_en":"Victory #1 — the king explosion","text_ru":"Самая частая победа в атоме: белые бьют рядом с королём — король исчезает. Девять из десяти партий заканчиваются не матом, а взрывом. На доске — реальная задача из базы: найдите решающее взятие.","text_en":"The most common win in atomic: White captures next to the king — the king vanishes. Nine of ten games end not with mate but with an explosion. The board shows a real task from the database: find the decisive capture.","num":6},{"id":"real-mate","fen":"rnb1k2r/pp3Npp/2p1p3/1B1p1p1Q/1b1PnP2/2P1P1Pq/PP5P/RNB1K2R b KQkq - 2 10","moves":["h3f1"],"title_ru":"Победа №2 — тихий мат","title_en":"Victory #2 — the quiet mate","text_ru":"Ферзь идёт на f1 — прямо под бой белого короля — и это мат! Король не может взять ферзя: при взрыве погиб бы он сам. В атоме мат часто ставится фигурой, стоящей под боем, — классическая шахматная интуиция здесь подводит.","text_en":"The queen steps to f1 — right into the white king's attack — and it is mate! The king cannot capture the queen: the explosion would kill the king itself. In atomic, mate is often delivered by a piece that is itself attacked — classical intuition fails here.","num":7},{"id":"queen-kamikaze","fen":"r1b1k3/p1q5/n5pb/Qp1p1p2/2PP3P/4P3/PP4P1/RNB2RK1 w - - 13 24","moves":["a5c7"],"title_ru":"Ферзь-камикадзе","title_en":"The kamikaze queen","text_ru":"Из вашей партии: ферзь бьёт ферзя — и обе покидают доску. Размен через взрыв выгоден тому, кто заранее посчитал радиус и понял, чья позиция развалится. Нажмите «Показать ход».","text_en":"From your own game: queen takes queen — and both leave the board. A trade through an explosion favors the one who counted the radius in advance and understood whose position falls apart. Press “Show the move”.","num":8}]},{"part_ru":"Часть третья. Стратегия","part_en":"Part three. Strategy","chapters":[{"id":"pawn-chain","fen":"5rk1/5ppp/8/8/8/8/5PPP/5RK1 w - - 0 1","moves":[],"title_ru":"Пешечная цепь — крепость короля","title_en":"The pawn chain — the king's fortress","text_ru":"Классическая крепость: король за цепью f7-g6-h7. Взрыв не берёт пешки, конь и слон не пробивают их без помощи. Строите дом — стройте пешечную цепь. Ломаете чужую — зовите ферзя.","text_en":"A classic fortress: the king behind the chain f7-g6-h7. The blast cannot take pawns; a knight or bishop cannot break them without help. Building a house? Build a pawn chain. Breaking someone else's? Call the queen.","num":9},{"id":"knight-hunter","fen":"5rk1/5N2/8/8/8/8/8/K6 w - - 0 1","moves":[],"title_ru":"Конь — охотник на королей","title_en":"The knight — the king hunter","text_ru":"Конь f7 уже бьёт ладью h8 и перепрыгивает пешечные заслоны, которые держат ферзя. Кони — главные охотники атома: они не боятся взрывов и атакуют поля, до которых ферзю не добраться.","text_en":"The knight on f7 already attacks the rook h8 and jumps over the pawn screens that stop the queen. Knights are the chief hunters of atomic: they fear no blasts and reach what a queen cannot.","num":10},{"id":"checklist","fen":null,"moves":[],"title_ru":"Контрольный список","title_en":"The checklist","text_ru":"Перед каждым взятием — три вопроса. 1) Кто исчезнет в радиусе? 2) Не взорвётся ли мой король? 3) Не открою ли я линию на своего короля? Считайте быстро — и вы будете играть на уровне F55555.","text_en":"Before every capture — three questions. 1) Who vanishes in the radius? 2) Will my own king explode? 3) Am I opening a line against my king? Count fast — and you will play at the F55555 level.","num":11}]},{"part_ru":"Часть четвёртая. Дебюты","part_en":"Part four. Openings","chapters":[{"id":"opening-main","fen":"rnbqk1nr/ppp1p1bp/5pp1/3p4/3P4/2N1PN2/PPP2PPP/R1BQKB1R w KQkq - 1 5","moves":[],"title_ru":"Главный дебют: 1.Кf3 f6 2.Кc3","title_en":"The main opening: 1.Nf3 f6 2.Nc3","text_ru":"Дебют №1 атома. Идеи: кони выходят первыми (f3/f6 — контроль e5/e4), пешки e3+d4 или e4 строят центр, слон c4/b5 нависает над f7/f2, конь прыгает g5. Чёрные отвечают d5/c6/e5 или g6. На доске — табия после 8 ходов.","text_en":"Opening #1 of atomic. Ideas: knights come first (f3/f6 control e5/e4), pawns e3+d4 or e4 build the center, the bishop eyes c4/b5 against f7/f2, a knight jumps to g5. Black answers d5/c6/e5 or g6. The board shows the tabiya after 8 moves.","num":12},{"id":"openings-db","fen":null,"moves":[],"title_ru":"Дебютный репертуар из базы","title_en":"Opening repertoire from the database","text_ru":"Статистика первых трёх ходов по всем 54 партиям базы: ваши, топ-игроков и бота. Смотрите, какие линии реально встречаются и с каким счётом.","text_en":"Statistics of the first three moves across all 54 games of the database: yours, top players and the bot. See which lines really occur and with what score.","num":13},{"id":"opening-traps","fen":null,"moves":[],"title_ru":"Дебютные ловушки","title_en":"Opening traps","text_ru":"Три классические ловушки атома. 1) Конь g5 прыгает f7/h7: двойной удар по пешкам и королю — не торопитесь их брать. 2) Ранний выход ферзя Qh5/Qh4: жертвуйте g3/g4 и гоните ферзя, теряя темп — у атакующего темп кончится. 3) Слоновые шахи b5/c4/g4 вынуждают ослаблять королевский фланг — заранее держите пешку f6/h6. Все три встречаются в партиях базы — смотрите раздел «Партии».","text_en":"Three classic atomic traps. 1) A knight to g5 hits f7/h7: do not rush to capture those pawns. 2) An early queen raid Qh5/Qh4: push g3/g4 and chase it, gaining tempo — the attacker runs out of steam. 3) Bishop checks on b5/c4/g4 force king-side weakening — keep f6/h6 pawns ready. All three appear in the database games — see the Games section.","num":14}]}],"openings":[{"n":5,"w":3,"d":0,"bl":2,"sans":"Nf3 f6 Nc3 c6 e4 e6"},{"n":4,"w":3,"d":0,"bl":1,"sans":"Nf3 e5 Ng5 f5 e3 Bb4"},{"n":4,"w":1,"d":0,"bl":3,"sans":"Nf3 e5 Ng5 f5 d4 e4"},{"n":4,"w":0,"d":0,"bl":4,"sans":"Nc3 e5 e3 Bb4 Bb5 c6"},{"n":3,"w":1,"d":0,"bl":2,"sans":"Nf3 f6 Nc3 c6 Nd5 cxd5"},{"n":3,"w":2,"d":0,"bl":1,"sans":"Nf3 f6 c3 e6 e4 d5"},{"n":2,"w":2,"d":0,"bl":0,"sans":"Nf3 f6 Nc3 c6 e3 e6"},{"n":2,"w":2,"d":0,"bl":0,"sans":"Nf3 f6 Nc3 Nh6 g4 c6"},{"n":2,"w":2,"d":0,"bl":0,"sans":"e3 e6 Nf3 Bb4 c3 d5"},{"n":2,"w":2,"d":0,"bl":0,"sans":"e3 e6 Nf3 Qf6 Bd3 Bb4"},{"n":2,"w":2,"d":0,"bl":0,"sans":"Nh3 h6 d4 f5 Nf4 e6"},{"n":1,"w":0,"d":1,"bl":0,"sans":"Nf3 f6 e3 d5 Ng5 fxg5"}],"exercises":[{"id":"ex-first-boom","fen":"k7/8/8/8/4p3/3P4/8/K7 w - - 0 1","num":1,"title_ru":"Первый взрыв","title_en":"The first explosion","goal_ru":"Возьми ЧЁРНУЮ пешку e4 своей пешкой d3 — обе исчезнут во взрыве! Ходи только БЕЛЫМИ.","goal_en":"Capture the BLACK pawn on e4 with your pawn d3 — both vanish in the blast! Move WHITE only.","check":{"kind":"capture-sq","sq":"e4"}},{"id":"ex-double","fen":"k7/8/8/4qn2/4p3/3Q4/8/1K6 w - - 0 1","num":2,"title_ru":"Двойной удар","title_en":"Double strike","goal_ru":"Ферзь берёт пешку e4 — взрыв уничтожает ферзя e5 и коня f5! Уничтожь 2 чёрные фигуры одним взрывом.","goal_en":"The queen takes the pawn on e4 — the blast destroys the queen e5 and knight f5! Destroy 2 black pieces with one capture.","check":{"kind":"destroy","n":2}},{"id":"ex-triple","fen":"k7/8/8/4qn2/4pr2/3Q4/8/1K6 w - - 0 1","num":3,"title_ru":"Полная зачистка","title_en":"Full cleanup","goal_ru":"Один взрыв на e4 уничтожает ферзя e5, коня f5 и ладью f4! Уничтожь все 3 чёрные фигуры одним ударом.","goal_en":"One blast on e4 destroys the queen e5, knight f5 and rook f4! Destroy all 3 black pieces in a single strike.","check":{"kind":"destroy","n":3}},{"id":"ex-boom-king","fen":"6k1/5p2/8/8/8/1Q6/8/K7 w - - 0 1","num":4,"title_ru":"Взрыв короля","title_en":"King explosion","goal_ru":"Ферзь бьёт пешку f7 — взрыв уничтожает короля g8! Это победа!","goal_en":"The queen captures the pawn on f7 — the blast kills the king on g8! That is victory!","check":{"kind":"boom-king"}},{"id":"ex-promote","fen":"k7/1P6/8/8/8/8/8/K7 w - - 0 1","num":5,"title_ru":"Пешка становится ферзём","title_en":"Pawn becomes a queen","goal_ru":"Проведи пешку b7 на b8 и преврати её в ФЕРЗЯ.","goal_en":"Push the pawn from b7 to b8 and promote it to a QUEEN.","check":{"kind":"promote"}},{"id":"ex-quiet-mate","fen":"6k1/8/5KQ1/8/8/8/8/8 w - - 0 1","num":6,"title_ru":"Тихий мат ферзём","title_en":"Quiet queen mate","goal_ru":"Поставь мат ферзём. Поле g7 защищает твой же король f6!","goal_en":"Deliver mate with the queen. Your king on f6 guards g7!","check":{"kind":"mate"}},{"id":"ex-maneuver","fen":"7k/7K/7p/8/8/8/8/7R w - - 0 1","num":7,"title_ru":"Манёвр ладьи","title_en":"The rook maneuver","goal_ru":"Пешка h6 взрывоопасна — брать нельзя! Проведи ладью с h1 на a1 и не подорвись.","goal_en":"The pawn on h6 is explosive — do not capture it! Take the rook from h1 to a1 without blowing yourself up.","check":{"kind":"reach","sq":"a1","piece":"R"}},{"id":"ex-kill-attacker","fen":"7k/8/8/8/5n2/6PR/8/7K w - - 0 1","num":8,"title_ru":"Убей нападающего","title_en":"Kill the attacker","goal_ru":"Конь f4 напал на ладью h3! Возьми его пешкой g3 — ВЗРЫВ УНИЧТОЖИТ ОБЕИХ: и коня, и твою пешку. Размен в твою пользу!","goal_en":"The knight on f4 attacked the rook h3! Capture it with the g3 pawn — THE BLAST DESTROYS BOTH: the knight and your pawn. A trade in your favor.","check":{"kind":"destroy","n":1}},{"id":"ex-pawn-armor","fen":"6k1/8/8/3p1p2/4p3/3P2P1/8/6K1 w - - 0 1","num":9,"title_ru":"Пешки — броня","title_en":"Pawns are armor","goal_ru":"Уничтожь чёрную пешку e4, но НЕ тронь пешки d5 и f5 — они НЕ взрываются! Ходи d3:e4 или g3:e4.","goal_en":"Destroy the black pawn on e4, but do NOT touch d5 and f5 — pawns do NOT explode! Play d3:e4 or g3:e4.","check":{"kind":"capture-sq","sq":"e4"}},{"id":"ex-en-passant","fen":"6k1/8/8/3pP3/8/8/8/6K1 w - d6 0 1","num":10,"title_ru":"Взятие на проходе","title_en":"En passant","goal_ru":"Чёрная пешка только что сходила d7-d5. Возьми её на проходе: пешка e5 бьёт на d6! Обе исчезнут во взрыве.","goal_en":"The black pawn just moved d7-d5. Capture it en passant: the e5 pawn takes on d6! Both vanish in the blast.","check":{"kind":"capture-sq","sq":"d6"}},{"id":"ex-castle","fen":"4k3/8/8/8/8/8/8/R3K2R w KQ - 0 1","num":11,"title_ru":"Рокировка","title_en":"Castling","goal_ru":"Сделай короткую рокировку: король e1 идёт на g1, ладья h1 перескакивает на f1.","goal_en":"Castle short: the king from e1 goes to g1, the rook from h1 jumps to f1.","check":{"kind":"reach","sq":"f1","piece":"R"}},{"id":"ex-double-boom","fen":"6k1/5ppp/8/4q3/8/2B5/8/5K2 w - - 0 1","num":12,"title_ru":"Комбо-взрыв","title_en":"Combo explosion","goal_ru":"Возьми ФЕРЗЯ e5 слоном d3 — взрыв уничтожит их обоих. Пешки f7, g7, h7 выживут (пешки не взрываются), но чёрные потеряют ферзя!","goal_en":"Capture the QUEEN on e5 with the bishop from d3 — the blast destroys both of them. Pawns f7, g7, h7 survive (pawns don't explode), but black loses their queen!","check":{"kind":"destroy","n":1}},{"id":"ex-save-king","fen":"6k1/5ppp/8/8/8/8/5PPP/5K1R w - - 0 1","num":13,"title_ru":"Укрой короля","title_en":"Shelter the king","goal_ru":"Чёрные вот-вот взорвут твоего короля через h7! Сходи h2-h3 — построй стену, которая усложнит подрыв.","goal_en":"Black is about to explode your king through h7! Play h2-h3 — build a wall that makes the demolition harder.","check":{"kind":"reach","sq":"h3","piece":"P"}}]};
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", sans-serif; background: #0b0e14; color: #e6edf3; min-height: 100vh; }
  a { color: #58a6ff; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header.hero {
    background: linear-gradient(160deg, #1a2332, #0b0e14 75%);
    border-bottom: 1px solid #21262d; padding: 36px 16px 24px; text-align: center;
  }
  .hero h1 { font-size: 36px; }
  .hero h1 span { color: #f0883e; }
  .hero .sub { color: #8b949e; margin-top: 8px; font-size: 17px; }
  .langsw { position: absolute; top: 14px; right: 16px; display: flex; gap: 6px; }
  .langsw button { background:#161b22; color:#c9d1d9; border:1px solid #30363d; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; font-weight:700; }
  .langsw button.act { background:#bb5b14; border-color:#f0883e; color:#fff; }
  .pillrow { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .pill { background:#161b22; border:1px solid #30363d; border-radius:20px; padding:5px 14px; font-size:13px; color:#8b949e;}
  .pill b { color:#f0883e; }
  .gold { color:#e3b341; font-weight:700; }

  nav.tabs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:22px 0 6px; }
  nav.tabs button {
    background:#161b22; color:#c9d1d9; border:1px solid #30363d; border-radius:10px;
    padding:10px 20px; font-size:15px; cursor:pointer; transition:.15s;
  }
  nav.tabs button:hover { border-color:#8b949e; }
  nav.tabs button.act { background:#bb5b14; border-color:#f0883e; color:#fff; font-weight:600; }
  section.page { display:none; padding: 18px 0 60px; }
  section.page.act { display:block; }

  h2.sect { font-size: 24px; margin: 18px 0 12px; }
  h3.sect { font-size: 18px; margin: 16px 0 8px; color:#f0883e; }
  .card { background:#11161d; border:1px solid #21262d; border-radius:12px; padding:16px; margin:12px 0; }
  .cols { display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start; }
  .col { flex:1; min-width: 300px; }

  /* ===== доска: ровные квадратные клетки, влезает в любую колонку ===== */
  .board {
    display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
    width:min(440px,100%,92vw); aspect-ratio:1;
    border:3px solid #3d2914; border-radius:6px; overflow:hidden; user-select:none; touch-action:manipulation;
  }
  .sq { position:relative; display:flex; align-items:center; justify-content:center; cursor:default; overflow:hidden; }
  .sq.light { background:#f0d9b5; }
  .sq.dark { background:#b58863; }
  .sq .pc { line-height:1; z-index:2; font-size:min(7.2vw,36px); text-shadow:0 1px 2px rgba(0,0,0,.4); }
  .sq .pc.w { color:#fff; } .sq .pc.b { color:#1a1a1a; }
  .sq.sel { outline:3px solid #f0883e; outline-offset:-3px; z-index:3; }
  .sq.mv { cursor:pointer; }
  .sq.mv::after { content:""; position:absolute; width:30%; height:30%; border-radius:50%; background:rgba(32,17,4,.45); z-index:1; }
  .sq.cap::after { width:92%; height:92%; background:transparent; border:4px solid rgba(240,80,30,.75); border-radius:6px; }
  .sq.last { box-shadow: inset 0 0 0 100vmax rgba(240,136,62,.28); }
  .sq.boom { animation: boom .9s ease-out; }
  .sq.boom::before { content:"💥"; position:absolute; font-size:34px; z-index:5; animation: boomscale .9s ease-out; }
  @keyframes boom { 0%{background:#ff7b39} 60%{background:#ffb26b} 100%{} }
  @keyframes boomscale { 0%{transform:scale(.4);opacity:1} 100%{transform:scale(2.2);opacity:0} }
  .boardwrap { position:relative; }
  .blabel { font-size:13px; color:#8b949e; margin-top:6px; text-align:center; min-height:20px; }

  .btn { background:#21262d; color:#e6edf3; border:1px solid #30363d; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:14px; }
  .btn:hover { border-color:#8b949e; }
  .btn.main { background:#bb5b14; border-color:#f0883e; font-weight:600; }
  .btn:disabled { opacity:.4; cursor:default; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  .note { border-radius:10px; padding:10px 14px; margin:10px 0; font-size:14.5px; }
  .note.ok { background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.5); }
  .note.err { background:rgba(248,81,73,.12); border:1px solid rgba(248,81,73,.5); }
  .note.info { background:rgba(88,166,255,.1); border:1px solid rgba(88,166,255,.4); }

  .rule { border-left:3px solid #f0883e; padding:8px 14px; margin:10px 0; background:#11161d; border-radius:0 10px 10px 0; }
  .rule b { color:#f0883e; }
  .rulelist p { margin:6px 0; }

  .pz-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .pz-tag { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:4px 10px; font-size:13px; }
  .score { font-size:15px; }
  .movelist { display:flex; flex-wrap:wrap; gap:4px; font-family:Consolas,monospace; font-size:13px; max-height:180px; overflow:auto; }
  .movelist span { background:#161b22; border-radius:5px; padding:2px 7px; }
  .movelist span.cur { background:#bb5b14; color:#fff; }
  .gameitem { display:block; width:100%; text-align:left; background:#11161d; border:1px solid #21262d; border-radius:8px;
    padding:8px 12px; margin:6px 0; cursor:pointer; color:#c9d1d9; font-size:14px; }
  .gameitem:hover { border-color:#f0883e; }
  .gameitem.act { border-color:#f0883e; background:#1a1208; }
  .srcbtn { border-radius:20px; padding:4px 12px; font-size:13px; cursor:pointer; border:1px solid #30363d; background:#161b22; color:#c9d1d9; }
  .srcbtn.act { background:#bb5b14; border-color:#f0883e; color:#fff; }
  table.lb { width:100%; border-collapse:collapse; font-size:14.5px; }
  table.lb td, table.lb th { padding:7px 10px; border-bottom:1px solid #21262d; text-align:left; }
  table.lb tr.me td { background:#2a1a08; color:#ffb26b; font-weight:600; }
  .muted { color:#8b949e; font-size:13px; }
  .big { font-size: 42px; }
  .badge { display:inline-block; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:4px 10px; font-size:12.5px; color:#8b949e; }
  .ok-badge { color:#3fb950; font-weight:700; }
  footer { text-align:center; color:#8b949e; padding:26px; font-size:13.5px; border-top:1px solid #21262d; }
  /* === Lichess-style trainer === */
  .pzrate { border-color:#8957e5 !important; background:linear-gradient(135deg,#161b22,#1c1130) !important; font-weight:600; }
  .pzrate b { font-size:15px; }
  #pzRateDiff { display:inline-block; margin-left:6px; font-weight:800; font-size:13px; opacity:0; }
  #pzRateDiff.up { color:#3fb950; animation:rdpop 1.6s ease; }
  #pzRateDiff.down { color:#f85149; animation:rdpop 1.6s ease; }
  @keyframes rdpop { 0%{opacity:0; transform:translateY(6px) scale(.7);} 15%{opacity:1; transform:translateY(0) scale(1.15);} 30%{transform:scale(1);} 75%{opacity:1;} 100%{opacity:0; transform:translateY(-8px);} }
  #pzStreakWrap.hot { border-color:#da3633 !important; background:linear-gradient(135deg,#161b22,#2d1114) !important; animation:flame 1s ease infinite alternate; }
  @keyframes flame { from{box-shadow:0 0 2px #f85133;} to{box-shadow:0 0 12px #f85133;} }
  .pzflash-ok { animation:fok .65s ease; }
  .pzflash-err { animation:ferr .65s ease; }
  @keyframes fok { 0%{box-shadow:0 0 0 3px #3fb950, 0 0 24px #3fb950;} 100%{box-shadow:none;} }
  @keyframes ferr { 0%{box-shadow:0 0 0 3px #f85149, 0 0 24px #f85149;} 100%{box-shadow:none;} }
  .pz-solved-banner { animation:bpop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes bpop { from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;} }
</style>
</head>

    <h3 style="margin-bottom:6px; font-size:20px" data-i18n="auth.title"></h3>

}

function pzPickNext() {

function pzNextVis(dir) {

function pzDraw() {
  drawBoard(document.getElementById("pzBoard"), pzSt, { flip: DATA.puzzles[pzi].side === "b",
    canMove: true, legal: pzLegal, sel: pzSel, onTarget: pzTarget, onSelect: idx => { pzSel = idx; pzDraw(); } });
}
function pzTarget(idx) {
  const cand = pzLegal.filter(m => m.from === pzSel && m.to === idx);
  if (!cand.length) { pzSel = null; pzDraw(); return; }
  const mv = cand.sort((a,b) => (b.promo ? 1 : 0) - (a.promo ? 1 : 0))[0];
  const u = uciOf(mv).slice(0, 4);
  const sol = DATA.puzzles[pzi].sol.slice(0, 4);
  if (u === sol) {
    const exploded = applyMove(pzSt, mv);

  } else {
    pzBad++; pzTries++;
    document.getElementById("pzScore").innerHTML = `✅ ${pzOK} &nbsp; ❌ ${pzBad}`;
    if (pzTries >= 3) {

  }
}

function importPgnText(text, src) {
  let added = 0, failed = 0;
  const blocks = text.split(/\n\n(?=\[Event)/).filter(b => b.includes("[Event"));
  for (const blk of blocks) {
    try {
      const tag = n => { const m = blk.match(new RegExp('\\[' + n + ' "([^"]*)"\\]')); return m ? m[1] : ""; };
      if (tag("Variant") && tag("Variant").toLowerCase() !== "atomic") continue;
      let sanText = blk.split(/\n\n/).slice(1).join(" ");
      sanText = sanText.replace(/\{[^}]*\}/g, " ").replace(/\([^)]*\)/g, " ").replace(/\$\d+/g, " ");
      const tokens = sanText.replace(/(1-0|0-1|1\/2-1\/2|\*).*$/, " ").trim().split(/\s+/).filter(t => t && !/^\d+\.+$/.test(t) && t !== "...");
      const moves = [];
      const st = chessVariantStart();
      for (let t of tokens) {
        t = t.replace(/^\d+\.+/, "").replace(/\+|#|!|\?/g, "");
        if (!t) continue;
        const found = genLegal(st).find(m => makeSAN(st, m).replace(/[+#]/g, "") === t);
        if (!found) throw new Error("bad san " + t);
        moves.push(uciOf(found));
        applyMove(st, found);
      }
      if (moves.length < 4) throw new Error("short");
      allGames.push({ w: tag("White") || "?", b: tag("Black") || "?", r: tag("Result") || "*", d: tag("UTCDate") || tag("Date") || "",
        tc: tag("TimeControl") || "", term: tag("Termination") || "", we: tag("WhiteElo") || "", be: tag("BlackElo") || "",
        id: tag("GameId") || "", src: src || "import", m: moves });
      added++;
    } catch (e) { failed++; }
  }
  return { added, failed };
}
document.getElementById("pgnFile").addEventListener("change", async ev => {
  const files = [...ev.target.files];
  const msg = document.getElementById("impMsg");
  let added = 0, failed = 0;
  for (const file of files) {
    const text = await file.text();
    const res = importPgnText(text, "import");
    added += res.added; failed += res.failed;
  }
  msg.innerHTML = `<div class="note ${added ? "ok" : "err"}">${T("imp.done")} ${added}${failed ? `, ${T("imp.failed")} ${failed}` : ""}</div>`;
  gFilter = "import";
  document.querySelectorAll(".srcbtn").forEach(x => x.classList.toggle("act", x.dataset.src === "import"));
  refreshList();
});

/* ================= ВХОД ЧЕРЕЗ LICHESS — как на stepchess.ru =================
   Lichess поддерживает НЕзарегистрированные публичные OAuth-клиенты (PKCE):
   client_id может быть любой уникальной строкой, регистрация приложения не нужна
   (страница /account/oauth/app удалена — поэтому и не находится). */
const LICHESS_CLIENT_ID = "atomic-trainer"; // публичный клиент, менять не нужно
const OAUTH_CLIENT_KEY = "atClientId";

function generateRandomString(length) {
  const arr = new Uint8Array(length);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode(...arr)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function generateChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function getClientId() {
  return (LICHESS_CLIENT_ID || localStorage.getItem(OAUTH_CLIENT_KEY) || "").trim();
}
function openLogin() {
  document.getElementById("loginModal").style.display = "flex";
  document.getElementById("cidUri").textContent = location.origin + location.pathname;
}
function closeLogin() { document.getElementById("loginModal").style.display = "none"; }
function showLoginError(msg) {
  const el = document.getElementById("loginErr");
  el.textContent = msg;
  el.style.display = "block";
}
async function startOAuth() {
  document.getElementById("loginErr").style.display = "none";
  if (!crypto || !crypto.subtle) { showLoginError("Нужен https (или localhost)"); return; }
  let cid = getClientId();
  if (!cid) {
    // Приложение ещё не настроено: показываем форму первичной настройки
    cid = (document.getElementById("clientIdInput").value || "").trim();
    if (!cid) {
      document.getElementById("cidRow").style.display = "block";
      document.getElementById("clientIdInput").focus();
      return;
    }
    localStorage.setItem(OAUTH_CLIENT_KEY, cid);
  }
  const verifier = generateRandomString(43);
  const challenge = await generateChallenge(verifier);
  const state = generateRandomString(16);
  localStorage.setItem("oauth_verifier", verifier);
  localStorage.setItem("oauth_state", state);
  const p = new URLSearchParams({
    response_type: "code",
    client_id: cid,
    redirect_uri: location.origin + location.pathname,
    scope: "preference:read",
    code_challenge: challenge,
    code_challenge_method: "S256",
    state: state
  });
  location.href = "https://lichess.org/oauth?" + p.toString();
}
async function doLogin() {
  await startOAuth();
}
async function handleOAuthCallback() {
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  if (!code) return;
  // читаем и чистим заранее — verifier нужен ниже, раньше его удаляли ДО чтения (баг)
  const savedState = localStorage.getItem("oauth_state");
  const verifier = localStorage.getItem("oauth_verifier") || "";
  const cid = getClientId();
  localStorage.removeItem("oauth_state");
  localStorage.removeItem("oauth_verifier");
  const state = q.get("state");
  history.replaceState(null, "", location.pathname);
  if (!state || state !== savedState || !verifier || !cid) {
    openLogin();
    showLoginError(LANG === "en" ? "Session expired, try again" : "Сессия истекла, попробуйте ещё раз");
    return;
  }
  const body = new URLSearchParams({
    grant_type: "authorization_code",
    code: code,
    client_id: cid,
    code_verifier: verifier,
    redirect_uri: location.origin + location.pathname
  });
  try {
    const r = await fetch("https://lichess.org/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });
    const d = await r.json();
    if (d.access_token) {
      localStorage.setItem("atToken", d.access_token);
      closeLogin();
      renderAuth(); // внутри сам вызовет загрузку партий
    } else {
      openLogin();
      showLoginError(LANG === "en" ? "Authorization failed" : "Не удалось авторизоваться");
    }
  } catch (e) {
    openLogin();
    showLoginError(LANG === "en" ? "Network error" : "Ошибка сети");
  }
}
function lichLogout() {
  localStorage.removeItem("atToken");
  localStorage.removeItem("atNick");
  renderAuth();
  refreshList();
}
async function renderAuth() {
  const area = document.getElementById("authArea"), chip = document.getElementById("userChip");
  const token = localStorage.getItem("atToken");
  if (!token) { area.style.display = "block"; chip.style.display = "none"; return; }
  area.style.display = "none"; chip.style.display = "flex";
  try {
    const r = await fetch("https://lichess.org/api/account", { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) { lichLogout(); return; }
    const me = await r.json();
    document.getElementById("uName").textContent = me.username;
    localStorage.setItem("atNick", me.username);
    const at = me.perfs && me.perfs.atomic ? me.perfs.atomic.rating : null;
    document.getElementById("uRating").textContent = at ? ("\u2622\ufe0f " + at) : "";
    // вошёл (или вернулся на сайт) → сразу грузим его партии автоматически
    loadMyGames();
  } catch (e) {
    document.getElementById("uRating").textContent = "";
  }
}
async function loadMyGames() {
  const nick = localStorage.getItem("atNick");
  if (!nick) return;
  const btn = document.getElementById("myGamesBtn");
  btn.disabled = true;
  try {
    const r = await fetch("https://lichess.org/api/games/user/" + nick + "?perfType=atomic&max=25");

    gFilter = "import";

  } catch (e) {
    document.getElementById("gInfo").textContent = LANG === "en" ? "Failed to load" : "\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c";
  }
  btn.disabled = false;
}
