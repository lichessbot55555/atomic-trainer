<style>

  .gold { color:#e3b341; font-weight:700; }

  nav.tabs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:22px 0 6px; }

  .col { flex:1; min-width: 300px; }

  /* ===== доска: ровные квадратные клетки, влезает в любую колонку ===== */
  .board {
    display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
    width:min(440px,100%,92vw); aspect-ratio:1;
    border:3px solid #3d2914; border-radius:6px; overflow:hidden; user-select:none; touch-action:manipulation;
  }
  .sq { position:relative; display:flex; align-items:center; justify-content:center; cursor:default; overflow:hidden; }
  .sq.light { background:#f0d9b5; }
  .sq.dark { background:#b58863; }
  .sq .pc { line-height:1; z-index:2; font-size:min(7.2vw,36px); text-shadow:0 1px 2px rgba(0,0,0,.4); }
  .sq .pc.w { color:#fff; } .sq .pc.b { color:#1a1a1a; }
  .sq.sel { outline:3px solid #f0883e; outline-offset:-3px; z-index:3; }
  .sq.mv { cursor:pointer; }
  .sq.mv::after { content:""; position:absolute; width:30%; height:30%; border-radius:50%; background:rgba(32,17,4,.45); z-index:1; }
  .sq.cap::after { width:92%; height:92%; background:transparent; border:4px solid rgba(240,80,30,.75); border-radius:6px; }
  .sq.last { box-shadow: inset 0 0 0 100vmax rgba(240,136,62,.28); }
  .sq.boom { animation: boom .9s ease-out; }
  .sq.boom::before { content:"💥"; position:absolute; font-size:34px; z-index:5; animation: boomscale .9s ease-out; }
  @keyframes boom { 0%{background:#ff7b39} 60%{background:#ffb26b} 100%{} }
  @keyframes boomscale { 0%{transform:scale(.4);opacity:1} 100%{transform:scale(2.2);opacity:0} }
  .boardwrap { position:relative; }
  .blabel { font-size:13px; color:#8b949e; margin-top:6px; text-align:center; min-height:20px; }

  .btn { background:#21262d; color:#e6edf3; border:1px solid #30363d; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:14px; }
  .btn:hover { border-color:#8b949e; }
  .btn.main { background:#bb5b14; border-color:#f0883e; font-weight:600; }
  .btn:disabled { opacity:.4; cursor:default; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  .note { border-radius:10px; padding:10px 14px; margin:10px 0; font-size:14.5px; }
  .note.ok { background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.5); }
  .note.err { background:rgba(248,81,73,.12); border:1px solid rgba(248,81,73,.5); }
  .note.info { background:rgba(88,166,255,.1); border:1px solid rgba(88,166,255,.4); }

  .rule { border-left:3px solid #f0883e; padding:8px 14px; margin:10px 0; background:#11161d; border-radius:0 10px 10px 0; }
  .rule b { color:#f0883e; }
  .rulelist p { margin:6px 0; }

  .pz-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .pz-tag { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:4px 10px; font-size:13px; }
  .score { font-size:15px; }
  .movelist { display:flex; flex-wrap:wrap; gap:4px; font-family:Consolas,monospace; font-size:13px; max-height:180px; overflow:auto; }
  .movelist span { background:#161b22; border-radius:5px; padding:2px 7px; }
  .movelist span.cur { background:#bb5b14; color:#fff; }
  .gameitem { display:block; width:100%; text-align:left; background:#11161d; border:1px solid #21262d; border-radius:8px;
    padding:8px 12px; margin:6px 0; cursor:pointer; color:#c9d1d9; font-size:14px; }
  .gameitem:hover { border-color:#f0883e; }
  .gameitem.act { border-color:#f0883e; background:#1a1208; }
  .srcbtn { border-radius:20px; padding:4px 12px; font-size:13px; cursor:pointer; border:1px solid #30363d; background:#161b22; color:#c9d1d9; }
  .srcbtn.act { background:#bb5b14; border-color:#f0883e; color:#fff; }
  table.lb { width:100%; border-collapse:collapse; font-size:14.5px; }
  table.lb td, table.lb th { padding:7px 10px; border-bottom:1px solid #21262d; text-align:left; }
  table.lb tr.me td { background:#2a1a08; color:#ffb26b; font-weight:600; }
  .muted { color:#8b949e; font-size:13px; }
  .big { font-size: 42px; }
  .badge { display:inline-block; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:4px 10px; font-size:12.5px; color:#8b949e; }
  .ok-badge { color:#3fb950; font-weight:700; }
  footer { text-align:center; color:#8b949e; padding:26px; font-size:13.5px; border-top:1px solid #21262d; }
</style>

/* ================= АТОМНЫЙ ДВИЖОК ================= */
function parseFEN(fen) {
  const st = { b: new Array(64).fill(null), turn: "w", ep: -1, cr: { K: true, Q: true, k: true, q: true } };
  const [pos, turn, cast, ep] = fen.trim().split(/\s+/);
  const rows = pos.split("/");
  for (let rr = 0; rr < 8; rr++) {
    let f = 0;
    for (const ch of rows[7 - rr]) {
      if (/\d/.test(ch)) f += +ch;
      else { st.b[rr * 8 + f] = ch; f++; }
    }
  }
  st.turn = turn || "w";
  if (cast && cast !== "-") for (const c of "KQkq") if (!cast.includes(c)) st.cr[c] = false;
  if (ep && ep !== "-") st.ep = (ep.charCodeAt(0) - 97) + (parseInt(ep[1]) - 1) * 8;
  return st;
}
function clone(st) { return { b: st.b.slice(), turn: st.turn, ep: st.ep, cr: { ...st.cr } }; }
const isW = p => p && p === p.toUpperCase();
const colorOf = p => isW(p) ? "w" : "b";
const FILEi = i => i % 8, RANKi = i => i >> 3;

function attacked(st, sq, by) { // короли НЕ учитываются (атом!)
  const b = st.b, f = FILEi(sq), r = RANKi(sq);
  const pd = by === "w" ? 1 : -1;
  for (const df of [-1, 1]) {
    const ff = f + df, rr = r - pd;
    if (ff >= 0 && ff < 8 && rr >= 0 && rr < 8) {
      const p = b[rr * 8 + ff];
      if (p && (by === "w" ? p === "P" : p === "p")) return true;
    }
  }
  for (const [df, dr] of [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]) {
    const ff = f + df, rr = r + dr;
    if (ff < 0 || ff > 7 || rr < 0 || rr > 7) continue;
    const p = b[rr * 8 + ff];
    if (p && (by === "w" ? p === "N" : p === "n")) return true;
  }
  for (const [df, dr] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
    let ff = f + df, rr = r + dr;
    while (ff >= 0 && ff < 8 && rr >= 0 && rr < 8) {
      const p = b[rr * 8 + ff];
      if (p) { if (colorOf(p) === by && (p.toUpperCase() === "B" || p.toUpperCase() === "Q")) return true; break; }
      ff += df; rr += dr;
    }
  }
  for (const [df, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    let ff = f + df, rr = r + dr;
    while (ff >= 0 && ff < 8 && rr >= 0 && rr < 8) {
      const p = b[rr * 8 + ff];
      if (p) { if (colorOf(p) === by && (p.toUpperCase() === "R" || p.toUpperCase() === "Q")) return true; break; }
      ff += df; rr += dr;
    }
  }

}
function trTarget(idx) {
  const cand = trLegal.filter(m => m.from === trSel && m.to === idx);
  if (!cand.length) { trSel = null; trDraw(null); return; }
  const mv = cand.sort((a, b) => (b.promo ? 1 : 0) - (a.promo ? 1 : 0))[0];
  trLast = { to: idx, promo: mv.promo || null, captured: !!trSt.b[idx], exploded: [] };
  const exploded = applyMove(trSt, mv);
  trLast.exploded = exploded;
  trMoves++;

  beep(exploded.length ? "boom" : "move");

function trCheckGoal() {
  const c = DATA.exercises[trIdx].check;
  if (c.kind === "capture-sq") {
    const sqIdx = (c.sq.charCodeAt(0) - 97) + (parseInt(c.sq[1]) - 1) * 8;
    return !!(trLast && trLast.captured && trLast.to === sqIdx);
  }
  if (c.kind === "destroy") {
    const now = [...trSt.b].filter(p => p && !isW(p) && p.toUpperCase() !== "P").length;
    return (trInitB - now) >= c.n;
  }
  if (c.kind === "boom-king") return kingSq(trSt, "b") === -1;
  if (c.kind === "mate") return gameStatus(trSt) === "mate-loss";
  if (c.kind === "promote") return !!(trLast && trLast.promo === "Q");
  if (c.kind === "reach") {
    const sq = (c.sq.charCodeAt(0) - 97) + (parseInt(c.sq[1]) - 1) * 8;
    return trSt.b[sq] === "R";
  }
  return false;
}

function importPgnText(text, src) {
  let added = 0, failed = 0;
  const blocks = text.split(/\n\n(?=\[Event)/).filter(b => b.includes("[Event"));
  for (const blk of blocks) {
    try {
      const tag = n => { const m = blk.match(new RegExp('\\[' + n + ' "([^"]*)"\\]')); return m ? m[1] : ""; };
      if (tag("Variant") && tag("Variant").toLowerCase() !== "atomic") continue;
      let sanText = blk.split(/\n\n/).slice(1).join(" ");
      sanText = sanText.replace(/\{[^}]*\}/g, " ").replace(/\([^)]*\)/g, " ").replace(/\$\d+/g, " ");
      const tokens = sanText.replace(/(1-0|0-1|1\/2-1\/2|\*).*$/, " ").trim().split(/\s+/).filter(t => t && !/^\d+\.+$/.test(t) && t !== "...");
      const moves = [];
      const st = chessVariantStart();
      for (let t of tokens) {
        t = t.replace(/^\d+\.+/, "").replace(/\+|#|!|\?/g, "");
        if (!t) continue;
        const found = genLegal(st).find(m => makeSAN(st, m).replace(/[+#]/g, "") === t);
        if (!found) throw new Error("bad san " + t);
        moves.push(uciOf(found));
        applyMove(st, found);
      }
      if (moves.length < 4) throw new Error("short");
      allGames.push({ w: tag("White") || "?", b: tag("Black") || "?", r: tag("Result") || "*", d: tag("UTCDate") || tag("Date") || "",
        tc: tag("TimeControl") || "", term: tag("Termination") || "", we: tag("WhiteElo") || "", be: tag("BlackElo") || "",
        id: tag("GameId") || "", src: src || "import", m: moves });
      added++;
    } catch (e) { failed++; }
  }
  return { added, failed };
}
document.getElementById("pgnFile").addEventListener("change", async ev => {
  const files = [...ev.target.files];
  const msg = document.getElementById("impMsg");
  let added = 0, failed = 0;
  for (const file of files) {
    const text = await file.text();
    const res = importPgnText(text, "import");
    added += res.added; failed += res.failed;
  }
  msg.innerHTML = `<div class="note ${added ? "ok" : "err"}">${T("imp.done")} ${added}${failed ? `, ${T("imp.failed")} ${failed}` : ""}</div>`;
  gFilter = "import";
  document.querySelectorAll(".srcbtn").forEach(x => x.classList.toggle("act", x.dataset.src === "import"));
  refreshList();
});

/* ================= ВХОД ПО НИКУ LICHESS ================= */
function openLogin() {
  document.getElementById("loginModal").style.display = "flex";
  const inp = document.getElementById("nickInput");
  inp.focus();
}
function closeLogin() { document.getElementById("loginModal").style.display = "none"; }
function doLogin() {
  const v = document.getElementById("nickInput").value.trim();
  if (!v) return;
  localStorage.setItem("atNick", v);
  closeLogin();
  renderAuth();
  loadMyGames();
}
function lichLogout() {
  localStorage.removeItem("atNick");
  renderAuth();
  refreshList();
}
async function renderAuth() {
  const area = document.getElementById("authArea"), chip = document.getElementById("userChip");
  const nick = localStorage.getItem("atNick");
  if (!nick) { area.style.display = "block"; chip.style.display = "none"; return; }
  area.style.display = "none"; chip.style.display = "flex";
  document.getElementById("uName").textContent = nick;
  document.getElementById("uRating").textContent = "…";
  try {
    const r = await fetch("https://lichess.org/api/user/" + nick);
    if (!r.ok) throw new Error(r.status);
    const me = await r.json();
    const at = me.perfs && me.perfs.atomic ? me.perfs.atomic.rating : null;
    document.getElementById("uRating").textContent = at ? ("☢️ " + at) : "";
  } catch (e) {
    document.getElementById("uRating").textContent = "";
  }
}
async function loadMyGames() {
  const nick = localStorage.getItem("atNick");
  if (!nick) return;
  const btn = document.getElementById("myGamesBtn");
  btn.disabled = true;
  try {
    const r = await fetch("https://lichess.org/api/games/user/" + nick + "?perfType=atomic&max=25");
    if (!r.ok) throw new Error(r.status);
    const pgn = await r.text();
    const res = importPgnText(pgn, "import");
    gFilter = "import";
    document.querySelectorAll(".srcbtn").forEach(x => x.classList.toggle("act", x.dataset.src === "import"));
    refreshList();
    document.getElementById("gInfo").textContent = (LANG === "en" ? "Loaded " : "Загружено ") + res.added + (LANG === "en" ? " games" : " партий");
  } catch (e) {
    document.getElementById("gInfo").textContent = LANG === "en"
      ? "Failed to load games (Lichess rate limit — try again in a minute)"
      : "Не удалось загрузить (Lichess ограничил запросы — попробуйте через минуту)";
  }
  btn.disabled = false;
}

/* ================= СТАРТ ================= */
renderTrainer();
trLoad();
document.querySelectorAll("#pzFilters .srcbtn").forEach(b => b.onclick = () => {
  document.querySelectorAll("#pzFilters .srcbtn").forEach(x => x.classList.remove("act"));
  b.classList.add("act");
  pzFilter = b.dataset.pf;
  pzNextVis(1);
});
document.addEventListener("keydown", ev => {
  if (!document.getElementById("p-games").classList.contains("act")) return;
  if (ev.target && ["INPUT", "TEXTAREA"].includes(ev.target.tagName)) return;
  if (ev.key === "ArrowLeft") { gStep(-1); ev.preventDefault(); }
  if (ev.key === "ArrowRight") { gStep(1); ev.preventDefault(); }
});
DATA.puzzles.sort((a, b) => (a.lvl || 1) - (b.lvl || 1));
pzLoad();
refreshList();
refreshLB(false);
setInterval(() => refreshLB(false), 30 * 60 * 1000); // каждые 30 минут
applyLang();
</script>
